name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Embed Google OAuth (release)
        env:
          REMINDER_GOOGLE_CLIENT_ID: ${{ secrets.REMINDER_GOOGLE_CLIENT_ID }}
          REMINDER_GOOGLE_CLIENT_SECRET: ${{ secrets.REMINDER_GOOGLE_CLIENT_SECRET }}
        run: bun scripts/embed-google-oauth.ts
      - run: bun run build
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/stable-linux-x64-Reminder-Setup.tar.gz
            artifacts/stable-linux-x64-Reminder.tar.zst
            artifacts/stable-linux-x64-update.json
          generate_release_notes: true
